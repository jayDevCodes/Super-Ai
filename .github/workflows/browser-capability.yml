name: Browser capability tests

on:
  pull_request:
    paths:
      - "capabilities/browser/**"
      - "tests/capability/test_browser_agent.py"
      - ".github/workflows/browser-capability.yml"
  push:
    branches:
      - "feature/browser-task-agent"

jobs:
  browser-capability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run browser capability tests
        run: python -m unittest discover -s tests/capability -p "test_browser_agent.py" -v
